<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard BOM, Stock, Purchasing</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
    header {
      background: linear-gradient(90deg, #2c3e50, #34495e);
      color: white; padding: 1rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 1.8rem; }
    .reset-btn {
      background: #e74c3c; color: white; border: none;
      cursor: pointer; padding: 8px 12px; border-radius: 5px;
    }
    .container {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; padding: 20px;
    }
    .card {
      background: white; padding: 20px; border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background: #3498db; color: white; }
    input, button { margin: 5px; padding: 8px; }
    canvas { width: 100% !important; height: 400px !important; }
  </style>
</head>
<body>
  <header>
    <h1>Integrated Production Dashboard</h1>
    <button type="button" class="reset-btn" onclick="resetAll()">Reset All</button>
  </header>

  <div class="container">
    <!-- BOM -->
    <div class="card">
      <h2>Bill of Material</h2>
      <form id="bomForm">
        <input type="text" id="bomItem" placeholder="Item Name" required>
        <input type="number" id="bomQty" placeholder="Quantity" required>
        <button type="submit">Add BOM</button>
      </form>
      <table>
        <thead><tr><th>Item</th><th>Quantity</th></tr></thead>
        <tbody id="bomTable"></tbody>
      </table>
    </div>

    <!-- Stock -->
    <div class="card">
      <h2>Stock</h2>
      <form id="stockForm">
        <input type="text" id="stockItem" placeholder="Item Name" required>
        <input type="number" id="stockQty" placeholder="Quantity" required>
        <button type="submit">Add Stock</button>
      </form>
      <table>
        <thead><tr><th>Item</th><th>Quantity</th></tr></thead>
        <tbody id="stockTable"></tbody>
      </table>
    </div>

    <!-- Purchasing -->
    <div class="card">
      <h2>Purchasing</h2>
      <table>
        <thead><tr><th>Item</th><th>Quantity Needed</th></tr></thead>
        <tbody id="purchaseTable"></tbody>
      </table>
    </div>
  </div>

  <!-- Grafik -->
  <div class="container">
    <div class="card" style="grid-column: span 3;">
      <h2>Grafik BOM, Stock, Purchasing</h2>
      <canvas id="dashboardChart"></canvas>
    </div>
  </div>

  <!-- Firebase & Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
  <script>
    // Konfigurasi Firebase
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let chart;

    // Tambah BOM
    document.getElementById('bomForm').addEventListener('submit', e => {
      e.preventDefault();
      const item = document.getElementById('bomItem').value;
      const qty = parseInt(document.getElementById('bomQty').value);
      db.ref('bom').push({ item, qty });
      e.target.reset();
    });

    // Tambah Stock
    document.getElementById('stockForm').addEventListener('submit', e => {
      e.preventDefault();
      const item = document.getElementById('stockItem').value;
      const qty = parseInt(document.getElementById('stockQty').value);
      db.ref('stock').push({ item, qty });
      e.target.reset();
    });

    // Reset All
    function resetAll() {
      db.ref('bom').remove();
      db.ref('stock').remove();
      db.ref('purchase').remove();
      if (chart) chart.destroy();
      alert("Semua data BOM, Stock, Purchasing, dan Grafik sudah direset!");
    }

    // Listener BOM
    db.ref('bom').on('value', snapshot => {
      document.getElementById('bomTable').innerHTML = "";
      snapshot.forEach(child => {
        const { item, qty } = child.val();
        addRow('bomTable', item, qty);
      });
      updateChart();
    });

    // Listener Stock
    db.ref('stock').on('value', snapshot => {
      document.getElementById('stockTable').innerHTML = "";
      snapshot.forEach(child => {
        const { item, qty } = child.val();
        addRow('stockTable', item, qty);
      });
      updateChart();
    });

    // Utility function
    function addRow(tableId, item, qty) {
      const table = document.getElementById(tableId);
      const row = document.createElement('tr');
      row.innerHTML = `<td>${item}</td><td>${qty}</td>`;
      table.appendChild(row);
    }

    // Update Chart
    function updateChart() {
      const bom = [];
      const stock = [];
      const labels = new Set();

      db.ref('bom').once('value', snap => {
        snap.forEach(child => {
          labels.add(child.val().item);
          bom.push(child.val());
        });
      });

      db.ref('stock').once('value', snap => {
        snap.forEach(child => {
          labels.add(child.val().item);
          stock.push(child.val());
        });
      });

      const lbls = Array.from(labels);
      const bomValues = lbls.map(l => {
        const found = bom.find(d => d.item === l);
        return found ? found.qty : 0;
      });
      const stockValues = lbls.map(l => {
        const found = stock.find(d => d.item === l);
        return found ? found.qty : 0;
      });

      const ctx = document.getElementById('dashboardChart').getContext('2d');
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: lbls,
          datasets: [
            { label: 'BOM', data: bomValues, backgroundColor: '#3498db' },
            { label: 'Stock', data: stockValues, backgroundColor: '#2ecc71' }
          ]
        },
        options: { responsive: true, scales: { y: { beginAtZero: true } } }
      });
    }
  </script>
</body>
</html>
